- term: 100-year flood
  id: 100-year-flood
  def: A flood event that has a 1 percent chance of being equaled or exceeded in any given year. (This term does not mean a flood that happens once a century. And it does not mean a flood that has a 1 percent chance of happening every year.)
- term: 25th Street Viaduct
  id: 25th-Street-Viaduct
  def: A 1.5-mile-long elevated freight track running through South Philadelphia, dividing the neighborhoods <a class="def-link" href="#Grays-Ferry">Grays Ferry</a> (on its west) from <a class="def-link" href="#Point-Breeze">Point Breeze</a> and West Passyunk (on its east). It was finished in 1928 by the Pennsylvania Railroad, complete with loading bays, in anticipation of a new corridor of factories. Instead came the Great Depression, WWII, and postwar deindustrialization. By the late twentieth century, the viaduct had become an unsightly and dangerous relic that regularly shed debris onto the street below. Auto repair shops became the main businesses in the shadow of squat Ionic columns made of steel-reinforced concrete. Now owned by CSX, the 25th Street Viaduct is still in use. In the 2010s, trains carrying crude oil from North Dakota’s Bakken formation regularly rolled through Philadelphia over this line.
- term: Act 2
  id: Act-2
  def: A short name for a package of laws passed by the Pennsylvania General Assembly in 1995 to encourage voluntary cleanup and reuse of <a class="def-link" href="#brownfields">brownfields</a> and other contaminated commercial and industrial sites. Also known as the “Land Recycling Program,” Act 2 established standards for environmental review and remediation, and processes for liability relief and financial assistance. The program is administered by the <a class="def-link" href="#DEP">DEP</a>.
  